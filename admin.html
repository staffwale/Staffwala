<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>StaffWale Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1c1b18;--mute:#6b675c;--line:#e3dfd2;--y:#f2c200;--g:#1f8a4c;--r:#c2321f}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--card:#211f17;--ink:#f4f1e6;--mute:#a7a28f;--line:#38352a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Hind,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:'Bricolage Grotesque',Hind,sans-serif;margin:0}
.top{background:var(--y);color:#1c1b18;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font:800 20px 'Bricolage Grotesque',sans-serif;display:flex;gap:8px;align-items:center}
.logo i{background:#1c1b18;color:var(--y);border-radius:8px;padding:1px 8px;font-style:normal}
#tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tb{border:0;background:rgba(255,255,255,.45);color:#1c1b18;border-radius:9px;padding:7px 14px;font:600 14px Hind,sans-serif;cursor:pointer}
.tb[aria-selected="true"]{background:#1c1b18;color:var(--y)}
main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.btn{border:0;cursor:pointer;background:var(--y);color:#1c1b18;font:600 14px Hind,sans-serif;padding:7px 12px;border-radius:8px}
.btn.alt{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn.bad{background:var(--r);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tb:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--mute)}
.cd b{display:block;font:800 26px 'Bricolage Grotesque',sans-serif;color:var(--ink)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{color:var(--mute);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.bd{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:#f6d4d0;color:#8a1f12}
.bd.ok{background:#d3ecdc;color:#17623a}
.warn{background:#fff4c2;color:#5c4a00;border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:600}
.empty{padding:22px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.m{color:var(--mute);font-size:13px}
.deny{max-width:560px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><i>S</i>Admin</div>
  <nav id="tabs" hidden></nav>
  <button class="btn alt" id="out" type="button" hidden>Logout</button>
</div>
<main id="main"><div class="empty">Load ho raha hai…</div></main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
var CFG=window.SW_CONFIG||{},$=function(i){return document.getElementById(i)},sb,tabNow='overview',F={q:'',role:'Partner',pend:false,pst:'Processing',jst:''};
var TABS=[['overview','Overview'],['users','Users'],['payouts','Payouts'],['jobs','Bookings'],['reviews','Reviews'],['payments','Payments'],['settings','Settings']];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dt(s){return s?String(s).slice(0,10):'—'}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},3200)}
async function rpc(n,a){var r=await sb.rpc(n,a||{});if(r.error)throw new Error(r.error.message);return r.data}
async function go(fn){try{return await fn()}catch(e){toast(e.message||'Error')}}
function tbl(h,rows){return rows.length?'<div class="tw"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>':'<div class="empty">Kuch nahi mila.</div>'}
function opt(list,sel){return list.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===sel?' selected':'')+'>'+x[1]+'</option>'}).join('')}

async function boot(){
  if(!CFG.SUPABASE_URL||/YOUR-/.test(CFG.SUPABASE_URL)){$('main').innerHTML='<div class="deny">config.js mein Supabase URL aur anon key daalein.</div>';return}
  sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  var s=(await sb.auth.getSession()).data.session;
  if(!s){location.replace('index.html?next=admin');return}
  var ok=false;try{ok=await rpc('is_admin')}catch(e){}
  $('out').hidden=false;$('out').onclick=async function(){await sb.auth.signOut();location.href='index.html'};
  if(!ok){$('main').innerHTML='<div class="deny"><h2>Aap admin nahi hain</h2><p>Is account ko admin banane ke liye Supabase SQL Editor mein ye chalayein (apna number daalkar):</p><p><code>update public.profiles set is_admin = true where mobile = \'9XXXXXXXXX\';</code></p><p class="m">Pehle admin.sql run hona chahiye.</p></div>';return}
  $('tabs').hidden=false;$('tabs').innerHTML=TABS.map(function(t){return '<button class="tb" data-t="'+t[0]+'" aria-selected="'+(t[0]===tabNow)+'">'+t[1]+'</button>'}).join('');
  show(tabNow);
}
function show(t){tabNow=t;document.querySelectorAll('.tb').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===t)});go(VIEW[t])}

var VIEW={
overview:async function(){
  var rd=await rpc('admin_jobs',{p_status:'RefundDue'}),rv=await rpc('admin_revenue'),s=await rpc('admin_stats'),c=[['Platform fee kamai (₹)',rv.fee_total],['Is mahine ki fee (₹)',rv.fee_month],['Subscription kamai (₹)',rv.subs],['Booking margin (₹)',rv.booking_margin],['Net platform kamai (₹)',rv.net],['Discount ka kharch (₹)',rv.discount_cost],['Baaki discounts (credits)',rv.pending_discounts],['Total users',s.users],['Customers',s.customers],['Partners',s.partners],['Owners',s.owners],['Verified partners',s.verified],['Verification pending',s.pending],['Open bookings',s.jobs_open],['Accepted',s.jobs_accepted],['Completed',s.jobs_completed],['Cancelled',s.jobs_cancelled],['Payouts pending',s.payouts_pending+' (₹'+s.payouts_amount+')'],['Partners ke wallet mein (₹)',s.wallet_total],['Active subscriptions',s.subs_active],['Reviews',s.reviews]];
  $('main').innerHTML='<h2 style="margin-bottom:14px">Overview</h2><div class="cards">'+c.map(function(x){return '<div class="cd"><b>'+esc(x[1])+'</b>'+x[0]+'</div>'}).join('')+'</div>'
   +(rv.booking_margin<0?'<div class="warn">⚠ Completed bookings par discount ka kharch fee se zyada hai (booking margin ₹'+rv.booking_margin+'). Fee badhane ya discount kam karne par vichar karein.</div>':'')
   +(rd.length>0?'<div class="warn">'+rd.length+' booking ka refund baaki hai. Bookings tab mein "Refund baaki" chunein.</div>':'')
   +(s.pending>0?'<div class="warn">'+s.pending+' partner verification ka intezaar kar rahe hain. Users tab mein "Sirf pending" chunein.</div>':'')
   +(s.payouts_pending>0?'<div class="warn">'+s.payouts_pending+' payout request pending hain (₹'+s.payouts_amount+').</div>':'');
},
users:async function(){
  $('main').innerHTML='<h2 style="margin-bottom:14px">Users</h2><div class="bar"><input id="uq" placeholder="Naam ya mobile search" value="'+esc(F.q)+'"><select id="ur">'+opt([['','Sab'],['Partner','Partner'],['Customer','Customer'],['Owner','Owner']],F.role)+'</select><label class="m"><input type="checkbox" id="up"'+(F.pend?' checked':'')+'> Sirf pending verification</label></div><div id="res"></div>';
  $('uq').oninput=function(){F.q=this.value;clearTimeout(VIEW.t);VIEW.t=setTimeout(loadUsers,300)};$('ur').onchange=function(){F.role=this.value;loadUsers()};$('up').onchange=function(){F.pend=this.checked;loadUsers()};
  await loadUsers();
},
payouts:async function(){
  $('main').innerHTML='<h2 style="margin-bottom:14px">Payouts</h2><div class="bar"><select id="ps">'+opt([['Processing','Pending'],['Paid','Paid'],['Rejected','Rejected'],['','Sab']],F.pst)+'</select></div><div id="res"></div>';
  $('ps').onchange=function(){F.pst=this.value;loadPayouts()};await loadPayouts();
},
jobs:async function(){
  $('main').innerHTML='<h2 style="margin-bottom:14px">Bookings</h2><div class="bar"><select id="js">'+opt([['','Sab'],['Open','Open'],['Accepted','Accepted'],['Completed','Completed'],['Cancelled','Cancelled'],['RefundDue','Refund baaki']],F.jst)+'</select></div><div id="res"></div>';
  $('js').onchange=function(){F.jst=this.value;loadJobs()};await loadJobs();
},
reviews:async function(){
  var l=await rpc('admin_reviews');
  $('main').innerHTML='<h2 style="margin-bottom:14px">Reviews</h2>'+tbl(['Date','Naam','Stars','Review',''],l.map(function(r){return [dt(r.created),esc(r.name),'★'.repeat(r.stars),esc(r.body),'<button class="btn bad" data-dr="'+r.id+'">Delete</button>']}));
},
payments:async function(){
  var l=await rpc('admin_payments'),paid=l.filter(function(p){return p.status==='paid'}),sum=paid.reduce(function(s,p){return s+Number(p.amount)},0);
  $('main').innerHTML='<h2 style="margin-bottom:14px">Payments</h2><div class="cards" style="margin-bottom:14px"><div class="cd"><b>₹'+sum+'</b>Kul collection (paid)</div><div class="cd"><b>'+paid.length+'</b>Paid payments</div></div>'+tbl(['Date','User','Purpose','Amount','Status','Razorpay IDs'],l.map(function(p){return [dt(p.created),esc(p.name)+'<br><span class="m">'+esc(p.mobile)+'</span>',esc(p.purpose),'₹'+p.amount,'<span class="bd'+(p.status==='paid'?' ok':'')+'">'+p.status+'</span>','<span class="m">'+esc(p.order)+'<br>'+esc(p.payment||'')+'</span>']}));
},
settings:async function(){
  var s=await rpc('admin_settings'),lg=await rpc('admin_log_list');
  $('main').innerHTML='<h2 style="margin-bottom:14px">Settings</h2><div class="cd" style="margin-bottom:18px"><b style="font-size:18px">Go-live check</b><p>Razorpay live jaane se pehle ye dabayein. Koi secret nahi dikhta, sirf haan/na.</p><button class="btn" id="hcRun">Check karein</button><div id="hcOut" style="margin-top:10px"></div></div><div class="cd" style="margin-bottom:18px"><b style="font-size:18px">Referral discount: <span class="bd'+(s.referral_discount_on==='false'?'':' ok')+'">'+(s.referral_discount_on==='false'?'OFF':'ON')+'</span></b><p>Customer ko 50% off milta hai, lekin ek booking par zyada se zyada niche likhe ₹ tak. Discount ka kharch platform ka hai (Overview mein "Discount ka kharch"). Refer karne wale ko reward tab milta hai jab dost ki pehli booking poori ho jaaye.</p><div class="bar"><label class="m">Max discount ₹ <input id="dcMax" type="number" min="0" max="2000" value="'+esc(s.max_discount||150)+'"></label><button class="btn" id="dcSave">Save</button><button class="btn alt" id="dcToggle" data-to="'+(s.referral_discount_on==='false'?'true':'false')+'">Referral discount '+(s.referral_discount_on==='false'?'ON':'OFF')+' karein</button></div></div><div class="cd" style="margin-bottom:18px"><b style="font-size:18px">Platform commission: '+esc(s.commission_pct||0)+'%</b><p>Customer "Kaam ho gaya" confirm kare to partner ko booking fare mein se itna % kat kar milta hai (0 se 30). Partner ko accept karte samay hi fee dikh jaati hai, aur wo us booking ke liye fix rehti hai. Sirf online paid ghar par bookings par lagta hai.</p><div class="bar"><input id="cm" type="number" min="0" max="30" value="'+esc(s.commission_pct||0)+'"><button class="btn" id="cmSave">Save</button></div></div><h3 style="margin-bottom:10px">Admin actions (last 50)</h3>'
   +tbl(['Date','Admin','Action','Detail'],lg.map(function(l){return [dt(l.created),esc(l.admin||''),esc(l.action),esc(l.detail)]}));
}};

async function loadUsers(){
  var l=await rpc('admin_users',{p_q:F.q,p_role:F.role,p_pending:F.pend});
  $('res').innerHTML=tbl(['Naam','Mobile','Role / Post','Shehar','Joined','Status','Wallet','Action'],l.map(function(u){
    var st=u.role==='Partner'?'<span class="bd'+(u.verified?' ok':'')+'">'+(u.verified?'Verified':'Pending')+'</span>':(u.sub_until&&u.sub_until>=dt(new Date().toISOString())?'<span class="bd ok">Sub '+u.sub_until+'</span>':'<span class="m">—</span>');
    var act=u.role==='Partner'?'<button class="btn'+(u.verified?' alt':'')+'" data-v="'+u.id+'|'+(u.verified?0:1)+'">'+(u.verified?'Unverify':'Verify karein')+'</button>':(u.role==='Admin'?'':'<button class="btn alt" data-sub="'+esc(u.mobile)+'">+30 din sub</button>');
    return [esc(u.name||'—')+(u.is_admin?' <span class="bd ok">admin</span>':''),esc(u.mobile),esc(u.role)+(u.post?' · '+esc(u.post):''),esc(u.city||''),dt(u.created),st,u.role==='Partner'?'₹'+u.wallet:'—',act]}));
}
async function loadPayouts(){
  var l=await rpc('admin_payouts',{p_status:F.pst});
  $('res').innerHTML=tbl(['Date','Partner','Amount','Kahan bhejna hai','Status',''],l.map(function(p){
    var dest=p.upi?'UPI: '+esc(p.upi):'',bank=p.account?'A/c: '+esc(p.account)+'<br>IFSC: '+esc(p.ifsc)+'<br>Naam: '+esc(p.holder):'';
    var copy=esc([p.holder,p.account,p.ifsc,p.upi].filter(Boolean).join(' | '));
    return [dt(p.created),esc(p.name)+'<br><span class="m">'+esc(p.mobile)+'</span>','<b>₹'+p.amount+'</b>',(dest+(dest&&bank?'<br>':'')+bank)||'<span class="m">Bank details nahi</span>','<span class="bd'+(p.status==='Paid'?' ok':'')+'">'+p.status+'</span>',
      p.status==='Processing'?'<button class="btn alt" data-cp="'+copy+'">Copy</button> <button class="btn" data-pay="'+p.id+'|Paid">Paid</button> <button class="btn bad" data-pay="'+p.id+'|Rejected">Reject</button>':'']}));
}
async function loadJobs(){
  var l=await rpc('admin_jobs',{p_status:F.jst});
  $('res').innerHTML=tbl(['Date','Kaam','Customer / Owner','Partner','Amount','Status','Payment',''],l.map(function(j){
    return [dt(j.date)+(j.slot?'<br><span class="m">'+esc(j.slot)+'</span>':''),esc(j.role)+(j.hours?' · '+j.hours+' hrs':'')+'<br><span class="m">'+(j.kind==='home'?'🏠 '+esc(j.address||''):esc(j.venue||''))+', '+esc(j.city)+'</span>',esc(j.oname)+'<br><span class="m">'+esc(j.omobile)+'</span>',j.pname?esc(j.pname)+'<br><span class="m">'+esc(j.pmobile)+'</span>':'—','₹'+j.pay+(j.disc?'<br><span class="m">Customer: ₹'+j.pays+' (₹'+(j.pay-j.pays)+' discount)</span>':''),'<span class="bd'+(j.status==='Completed'||j.status==='Accepted'?' ok':'')+'">'+j.status+'</span>','<span class="bd'+(j.pay_status==='paid'||j.pay_status==='refunded'?' ok':'')+'">'+esc(j.pay_status)+'</span>',(j.pay_status==='refund_due'?'<button class="btn" data-rf="'+j.id+'">Refund bhejein</button> ':'')+((j.status==='Open'||j.status==='Accepted')?'<button class="btn bad" data-cj="'+j.id+'">Cancel</button>':'')]}));
}

document.addEventListener('click',function(e){
  var t=e.target.closest('.tb');if(t){show(t.dataset.t);return}
  var v=e.target.closest('[data-v]');if(v){var p=v.dataset.v.split('|');go(async function(){await rpc('admin_set_verified',{p_uid:p[0],p_v:p[1]==='1'});toast('Update ho gaya.');await loadUsers()});return}
  var s=e.target.closest('[data-sub]');if(s){if(!confirm('Is user ko 30 din ka subscription dein?'))return;go(async function(){var d=await rpc('admin_grant_subscription',{p_mobile:s.dataset.sub,p_days:30});toast('Subscription '+d+' tak.');await loadUsers()});return}
  var pay=e.target.closest('[data-pay]');if(pay){var q=pay.dataset.pay.split('|');if(!confirm(q[1]==='Paid'?'Kya aapne ye paisa bhej diya hai? Status Paid ho jaayega.':'Reject karne par paisa partner ke wallet mein wapas jaayega. Pakka?'))return;go(async function(){await rpc('admin_mark_payout',{p_id:+q[0],p_status:q[1]});toast('Payout '+q[1]+'.');await loadPayouts()});return}
  var cp=e.target.closest('[data-cp]');if(cp){try{navigator.clipboard.writeText(cp.dataset.cp).then(function(){toast('Copy ho gaya.')})}catch(x){toast(cp.dataset.cp)}return}
  var rf=e.target.closest('[data-rf]');if(rf){if(!confirm('Customer ko refund bhejein?'))return;go(async function(){var tok=(await sb.auth.getSession()).data.session.access_token,r=await fetch('/.netlify/functions/admin-refund',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({job_id:rf.dataset.rf})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Error');toast(d.status==='done'?'Refund bhej diya gaya.':'Refund abhi pending hai. Razorpay dashboard check karein.');await loadJobs()});return}
  var cj=e.target.closest('[data-cj]');if(cj){if(!confirm('Ye booking cancel karein?'))return;go(async function(){await rpc('admin_cancel_job',{p_id:cj.dataset.cj});toast('Booking cancel.');await loadJobs()});return}
  var dr=e.target.closest('[data-dr]');if(dr){if(!confirm('Review delete karein?'))return;go(async function(){await rpc('admin_delete_review',{p_id:+dr.dataset.dr});toast('Delete ho gaya.');await VIEW.reviews()});return}
  if(e.target.id==='hcRun'){go(async function(){
    var tok=(await sb.auth.getSession()).data.session.access_token,r=await fetch('/.netlify/functions/health',{method:'POST',headers:{Authorization:'Bearer '+tok}}),d=await r.json();
    if(!r.ok)throw new Error(d.error||'Error');
    var pages=['terms.html','privacy.html','refund.html'],left=[];
    for(var i=0;i<pages.length;i++){try{var t=await (await fetch(pages[i])).text();if(/\[[A-Z][A-Z ]{2,}\]/.test(t))left.push(pages[i])}catch(x){left.push(pages[i]+' (nahi mila)')}}
    var c=window.SW_CONFIG||{},L=[
     [d.mode==='live',d.mode==='live'?'Razorpay LIVE keys lagi hain':(d.mode==='test'?'Abhi TEST keys hain (asli paisa nahi katega)':'Razorpay keys nahi mili')],
     [d.keys==='ok','Razorpay keys kaam kar rahi hain'+(d.keys==='ok'?'':' ('+d.keys+')')],
     [d.webhook_secret,'Webhook secret set hai (Razorpay Dashboard mein webhook alag se banana na bhoolein)'],
     [location.protocol==='https:','Site HTTPS par hai'],
     [!left.length,left.length?'Policy pages mein [BRACKET] details baaki: '+left.join(', '):'Policy pages mein koi [BRACKET] baaki nahi']];
    $('hcOut').innerHTML=L.map(function(x){return '<div>'+(x[0]?'✅ ':'⚠️ ')+esc(x[1])+'</div>'}).join('')+'<p class="m">Pura checklist: LIVE_CHECKLIST.md</p>'})
    return}
  if(e.target.id==='dcSave'){go(async function(){await rpc('admin_set_setting',{p_key:'max_discount',p_value:String(Math.floor(+$('dcMax').value))});toast('Max discount save ho gaya.');await VIEW.settings()});return}
  if(e.target.id==='dcToggle'){var to=e.target.dataset.to;go(async function(){await rpc('admin_set_setting',{p_key:'referral_discount_on',p_value:to});toast('Referral discount '+(to==='true'?'ON':'OFF')+'.');await VIEW.settings()});return}
  if(e.target.id==='cmSave'){go(async function(){await rpc('admin_set_setting',{p_key:'commission_pct',p_value:String(Math.floor(+$('cm').value))});toast('Commission save ho gaya.');await VIEW.settings()});return}
});
boot();
})();
</script>
</body>
</html>
